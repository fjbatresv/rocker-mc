name: Desplegar

# Un merge a main publica en dev automáticamente y deja producción esperando
# la aprobación del Environment `produccion`.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno a publicar'
        type: choice
        required: true
        default: produccion
        options: [produccion, dev]

# Heredado por los workflows llamados: necesario para el token OIDC de AWS.
permissions:
  id-token: write
  contents: read

jobs:
  verificar:
    name: Verificar el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Archivos críticos presentes
        run: |
          for f in site/index.html site/404.html site/assets/css/styles.css site/assets/js/main.js; do
            [ -s "$f" ] || { echo "::error::Falta o está vacío: $f"; exit 1; }
          done

      - name: Sin referencias rotas
        run: python3 .github/scripts/verificar_enlaces.py

  dev:
    name: Dev
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: desplegar-dev
      cancel-in-progress: false
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar la configuración del entorno
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          faltan=()
          [ -n "$AWS_REGION" ]   || faltan+=("variable AWS_REGION")
          [ -n "$SITE_URL" ]     || faltan+=("variable SITE_URL")
          [ -n "$ROLE_ARN" ]     || faltan+=("secreto AWS_ROLE_ARN")
          [ -n "$BUCKET" ]       || faltan+=("secreto AWS_S3_BUCKET")
          [ -n "$DISTRIBUTION" ] || faltan+=("secreto AWS_CLOUDFRONT_DISTRIBUTION_ID")
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Al entorno 'dev' le falta: ${faltan[*]}"
            exit 1
          fi
          echo "Entorno dev · región $AWS_REGION · $SITE_URL"

      - name: Asumir el rol de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Bloquear la indexación
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          rm -f site/sitemap.xml
          echo "robots.txt reemplazado por uno que bloquea todo y sitemap.xml retirado."

      - name: Subir assets con caché larga
        run: |
          aws s3 sync site/assets "s3://${{ secrets.AWS_S3_BUCKET }}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir HTML y metadatos sin caché de navegador
        run: |
          aws s3 sync site "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Corregir Content-Type de robots
        run: |
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt" \
                    "s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidar CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidación $ID en curso"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Resumen
        run: |
          {
            echo "### Publicado en dev"
            echo ""
            echo "- URL: ${{ vars.SITE_URL }}"
            echo "- Región: ${{ vars.AWS_REGION }}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Indexable: false"
          } >> "$GITHUB_STEP_SUMMARY"

  produccion:
    name: Producción
    needs: dev
    if: github.event_name == 'push' || inputs.entorno == 'produccion'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: desplegar-produccion
      cancel-in-progress: false
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar la configuración del entorno
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          faltan=()
          [ -n "$AWS_REGION" ]   || faltan+=("variable AWS_REGION")
          [ -n "$SITE_URL" ]     || faltan+=("variable SITE_URL")
          [ -n "$ROLE_ARN" ]     || faltan+=("secreto AWS_ROLE_ARN")
          [ -n "$BUCKET" ]       || faltan+=("secreto AWS_S3_BUCKET")
          [ -n "$DISTRIBUTION" ] || faltan+=("secreto AWS_CLOUDFRONT_DISTRIBUTION_ID")
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Al entorno 'produccion' le falta: ${faltan[*]}"
            exit 1
          fi
          echo "Entorno produccion · región $AWS_REGION · $SITE_URL"

      - name: Asumir el rol de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir assets con caché larga
        run: |
          aws s3 sync site/assets "s3://${{ secrets.AWS_S3_BUCKET }}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir HTML y metadatos sin caché de navegador
        run: |
          aws s3 sync site "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Corregir Content-Type de robots y sitemap
        run: |
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt" \
                    "s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/sitemap.xml" \
                    "s3://${{ secrets.AWS_S3_BUCKET }}/sitemap.xml" \
            --content-type "application/xml" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidar CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidación $ID en curso"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Resumen
        run: |
          {
            echo "### Publicado en produccion"
            echo ""
            echo "- URL: ${{ vars.SITE_URL }}"
            echo "- Región: ${{ vars.AWS_REGION }}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Indexable: true"
          } >> "$GITHUB_STEP_SUMMARY"
