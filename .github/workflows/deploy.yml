name: Desplegar

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archivos críticos presentes
        run: |
          for f in site/index.html site/404.html site/assets/css/styles.css site/assets/js/main.js landing/index.html landing/en/index.html landing/404.html landing/assets/css/landing.css; do
            [ -s "$f" ] || { echo "::error::Falta o está vacío: $f"; exit 1; }
          done

      - name: Pruebas de seguridad
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verificar enlaces
        run: python3 .github/scripts/verificar_enlaces.py --destino todos

      - name: Verificar seguridad y URLs
        run: python3 .github/scripts/verificar_seguridad.py --destino todos

  desplegar:
    name: Desplegar en AWS
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: dev
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: desplegar-aws
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar la configuración del entorno
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          faltan=()
          [ -n "$AWS_REGION" ]   || faltan+=("variable AWS_REGION")
          [ -n "$SITE_URL" ]     || faltan+=("variable SITE_URL")
          [ -n "$ROLE_ARN" ]     || faltan+=("secreto AWS_ROLE_ARN")
          [ -n "$BUCKET" ]       || faltan+=("secreto AWS_S3_BUCKET")
          [ -n "$DISTRIBUTION" ] || faltan+=("secreto AWS_CLOUDFRONT_DISTRIBUTION_ID")
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Al entorno 'dev' le falta: ${faltan[*]}"
            exit 1
          fi
          echo "Entorno dev · región $AWS_REGION · $SITE_URL"

      - name: Las URLs del sitio coinciden con SITE_URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 .github/scripts/verificar_seguridad.py --destino site --sitio "$SITE_URL"

      - name: Asumir el rol de AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir assets con caché larga
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync site/assets "s3://$BUCKET/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir HTML y metadatos sin caché de navegador
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync site "s3://$BUCKET" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Corregir Content-Type de robots y sitemap
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp "s3://$BUCKET/robots.txt" "s3://$BUCKET/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE
          aws s3 cp "s3://$BUCKET/sitemap.xml" "s3://$BUCKET/sitemap.xml" \
            --content-type "application/xml" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidar CloudFront
        env:
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidación $ID en curso"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" \
            --id "$ID"

      - name: Resumen
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          {
            echo "### Publicado en AWS"
            echo ""
            echo "- URL: $SITE_URL"
            echo "- Región: $AWS_REGION"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Indexable: true"
          } >> "$GITHUB_STEP_SUMMARY"
