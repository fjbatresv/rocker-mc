name: Publicar en un entorno

# Workflow reutilizable: la misma secuencia sirve para dev y para producción.
# Lo que cambia entre entornos son las variables y los secretos del Environment
# de GitHub, no el código de aquí.
on:
  workflow_call:
    inputs:
      entorno:
        description: 'Nombre del Environment de GitHub (dev o produccion)'
        type: string
        required: true
      indexable:
        description: 'Si es false, se sube un robots.txt que bloquea a los buscadores'
        type: boolean
        required: false
        default: false

jobs:
  publicar:
    name: ${{ inputs.entorno }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.entorno }}
      url: ${{ vars.SITE_URL }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Falla temprano y con un mensaje claro si al Environment le falta algo,
      # en vez de reventar más adelante con un error críptico de la AWS CLI.
      - name: Comprobar la configuración del entorno
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          faltan=()
          [ -n "$AWS_REGION" ]   || faltan+=("variable AWS_REGION")
          [ -n "$SITE_URL" ]     || faltan+=("variable SITE_URL")
          [ -n "$ROLE_ARN" ]     || faltan+=("secreto AWS_ROLE_ARN")
          [ -n "$BUCKET" ]       || faltan+=("secreto AWS_S3_BUCKET")
          [ -n "$DISTRIBUTION" ] || faltan+=("secreto AWS_CLOUDFRONT_DISTRIBUTION_ID")
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Al entorno '${{ inputs.entorno }}' le falta: ${faltan[*]}"
            exit 1
          fi
          echo "Entorno ${{ inputs.entorno }} · región $AWS_REGION · $SITE_URL"

      - name: Asumir el rol de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Los entornos que no son producción no deben aparecer en buscadores.
      - name: Bloquear la indexación
        if: ${{ !inputs.indexable }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          rm -f site/sitemap.xml
          echo "robots.txt reemplazado por uno que bloquea todo y sitemap.xml retirado."

      - name: Subir assets con caché larga
        run: |
          aws s3 sync site/assets "s3://${{ secrets.AWS_S3_BUCKET }}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir HTML y metadatos sin caché de navegador
        run: |
          aws s3 sync site "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Corregir Content-Type de robots y sitemap
        run: |
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt" \
                    "s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE
          if [ "${{ inputs.indexable }}" = "true" ]; then
            aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/sitemap.xml" \
                      "s3://${{ secrets.AWS_S3_BUCKET }}/sitemap.xml" \
              --content-type "application/xml" \
              --cache-control "public, max-age=3600" \
              --metadata-directive REPLACE
          fi

      - name: Invalidar CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidación $ID en curso"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Resumen
        run: |
          {
            echo "### Publicado en ${{ inputs.entorno }}"
            echo ""
            echo "- URL: ${{ vars.SITE_URL }}"
            echo "- Región: ${{ vars.AWS_REGION }}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Indexable: ${{ inputs.indexable }}"
          } >> "$GITHUB_STEP_SUMMARY"
